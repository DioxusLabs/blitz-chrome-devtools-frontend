name: Build

# Builds the frontend and checks the crate. Run manually with "publish crate"
# ticked to also publish the crate to crates.io (needs a CARGO_REGISTRY_TOKEN
# secret).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_crate:
        description: Publish the crate to crates.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # depot_tools, the devtools-frontend checkout (with its toolchains and
      # node_modules) and the build output, so that the build only syncs and
      # rebuilds what changed. The key covers scripts/build.sh, which pins the
      # revision and configures the checkout. On a miss, the most recent older
      # entry is restored and brought up to date by the build.
      - uses: actions/cache@v6
        with:
          path: build
          key: devtools-frontend-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: devtools-frontend-${{ runner.os }}-

      - name: Build the frontend
        run: ./scripts/build.sh

      # --allow-dirty: the crate includes dist.tar.br, which is built (and
      # gitignored) rather than committed
      - name: Check the crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo package --allow-dirty

      - name: Publish to crates.io
        if: github.event_name == 'workflow_dispatch' && inputs.publish_crate && github.ref == 'refs/heads/main'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
