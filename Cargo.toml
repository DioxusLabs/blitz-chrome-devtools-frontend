[package]
name = "blitz-chrome-devtools-frontend"
version = "0.1.0"
description = "A minimal build of the Chrome DevTools frontend, for inspecting Blitz documents"
license = "BSD-3-Clause AND MIT AND Apache-2.0"
repository = "https://github.com/DioxusLabs/blitz-chrome-devtools-frontend"
homepage = "https://github.com/DioxusLabs/blitz-chrome-devtools-frontend"
keywords = ["devtools", "blitz", "cdp"]
categories = ["development-tools::debugging"]
edition = "2024"
rust-version = "1.91.0"
# dist.tar.br is built by scripts/build.sh (and gitignored)
include = ["/src", "/dist.tar.br", "/LICENSE", "/README.md"]

[dependencies]
brotli-decompressor = "5"
